<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration | SKS ShopHub</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="Mystyles1.css">
</head>

<body style="background-color:rgb(175, 242, 242);">

  <center>
    <h1 style="font-family:Georgia, 'Times New Roman', Times, serif;">
      <img border="3" class="logo" src="shoplandlogo3.jpg" width="50" height="50">
      SHOP HUB
    </h1>
  </center>

  <!-- Navbar will appear here -->
  <div id="nav-root"></div>
  <script src="nav.js"></script>

  <br><br><br>

  <div class="registration-form container">
    <center>
      <h2>📝 Register New Account</h2>
    </center><br>

    <form id="regForm" onsubmit="registerUser(event)">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" class="form-control" placeholder="Enter your mobile number" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
  </div>

  <br><br><br><br><br>

  <footer>
    <p>@copy; www.sksshophub.com All Rights Reserved...</p>
  </footer>

  <!-- JavaScript -->
  <script src="auth.js"></script>

  <script>
    document.getElementById("profileIcon")?.addEventListener("click", function (event) {
      event.preventDefault();
      const popup = document.getElementById("profilePopup");
      popup.style.display = popup.style.display === "none" ? "block" : "none";
    });
  </script>

</body>

</html>
